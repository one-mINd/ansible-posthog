---
- name: Assert that required secrets are defined
  ansible.builtin.assert:
    that:
      - posthog_secret | length > 0
      - posthog_encryption_salt_keys | length > 0
      - posthog_browserless_secret | length > 0
    fail_msg: >-
      Переменные posthog_secret, posthog_encryption_salt_keys и
      posthog_browserless_secret должны быть заданы (обычно через vault).
    quiet: true

- name: Ensure posthog directory
  ansible.builtin.file:
    path: "{{ posthog_install_dir }}"
    state: directory
    mode: '0755'

- name: Clone PostHog repository
  ansible.builtin.git:
    repo: https://github.com/PostHog/posthog.git
    dest: "{{ posthog_install_dir }}"
    version: "{{ posthog_git_sha }}"
    depth: 1
    single_branch: true
    update: true
    force: true

- name: Check if .env file exists
  ansible.builtin.stat:
    path: "{{ posthog_install_dir }}/.env"
  register: posthog_env_file

- name: Generate .env file from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ posthog_install_dir }}/.env"
    mode: '0600'
  when: not posthog_env_file.stat.exists
  notify: Restart PostHog stack

# Существующий .env не перезаписываем (секреты), но CADDY_HOST обязателен:
# иначе за ALB Caddy отдаёт пустой HTTP 200 на несовпадающий Host.
- name: Ensure CADDY_HOST in existing .env
  ansible.builtin.lineinfile:
    path: "{{ posthog_install_dir }}/.env"
    regexp: '^CADDY_HOST='
    line: 'CADDY_HOST="{{ posthog_caddy_host }}"'
    mode: '0600'
  when: posthog_env_file.stat.exists
  notify: Restart PostHog stack

- name: Ensure TLS_BLOCK in existing .env
  ansible.builtin.lineinfile:
    path: "{{ posthog_install_dir }}/.env"
    regexp: '^TLS_BLOCK='
    line: 'TLS_BLOCK='
    mode: '0600'
  when: posthog_env_file.stat.exists and not posthog_use_staging_tls

- name: Ensure CADDY_TLS_BLOCK in existing .env
  ansible.builtin.lineinfile:
    path: "{{ posthog_install_dir }}/.env"
    regexp: '^CADDY_TLS_BLOCK='
    line: 'CADDY_TLS_BLOCK={{ posthog_caddy_tls_block }}'
    mode: '0600'
  when: posthog_env_file.stat.exists
  notify: Restart PostHog stack

- name: Ensure settings in existing .env
  ansible.builtin.lineinfile:
    path: "{{ posthog_install_dir }}/.env"
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
    mode: '0600'
  loop: >-
    {{ {'POSTHOG_APP_TAG': posthog_app_tag,
        'DOMAIN': posthog_domain,
        'REGISTRY_URL': posthog_registry_url}
       | combine(posthog_env_extra) | dict2items }}
  loop_control:
    label: "{{ item.key }}"
  when: posthog_env_file.stat.exists
  notify: Restart PostHog stack

- name: Ensure share directory exists
  ansible.builtin.file:
    path: "{{ posthog_install_dir }}/share"
    state: directory
    mode: '0755'

- name: Ensure compose directory exists
  ansible.builtin.file:
    path: "{{ posthog_install_dir }}/compose"
    state: directory
    mode: '0755'

- name: Write compose/start
  ansible.builtin.template:
    src: start.j2
    dest: "{{ posthog_install_dir }}/compose/start"
    mode: '0755'
  notify: Restart PostHog stack

- name: Write compose/wait
  ansible.builtin.copy:
    dest: "{{ posthog_install_dir }}/compose/wait"
    mode: '0755'
    content: |
      #!/usr/bin/env python3

      import socket
      import time

      def loop():
          print("Waiting for ClickHouse and Postgres to be ready")
          try:
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
                  s.connect(('clickhouse', 9000))
              print("Clickhouse is ready")
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
                  s.connect(('db', 5432))
              print("Postgres is ready")
          except ConnectionRefusedError:
              time.sleep(5)
              loop()

      loop()

- name: Write compose/temporal-django-worker
  ansible.builtin.copy:
    dest: "{{ posthog_install_dir }}/compose/temporal-django-worker"
    mode: '0755'
    content: |
      #!/bin/bash
      ./bin/temporal-django-worker

- name: Download GeoLite2-City.mmdb
  ansible.builtin.shell: |
    set -o pipefail
    curl -L 'https://mmdbcdn.posthog.net/' --http1.1 \
      | brotli --decompress > {{ posthog_install_dir }}/share/GeoLite2-City.mmdb
  args:
    creates: "{{ posthog_install_dir }}/share/GeoLite2-City.mmdb"
    executable: /bin/bash

- name: Read docker-compose.hobby.yml
  ansible.builtin.slurp:
    src: "{{ posthog_install_dir }}/docker-compose.hobby.yml"
  register: posthog_hobby_compose

- name: Write docker-compose.yml
  ansible.builtin.copy:
    dest: "{{ posthog_install_dir }}/docker-compose.yml"
    content: >-
      {{ posthog_hobby_compose.content | b64decode
         | replace('./posthog/', './')
         | replace('80:80', posthog_http_port ~ ':80')
         | replace('443:443', posthog_https_port ~ ':443') }}
    mode: '0644'
  notify: Restart PostHog stack

- name: Write docker-compose.override.yml
  ansible.builtin.copy:
    dest: "{{ posthog_install_dir }}/docker-compose.override.yml"
    content: "{{ posthog_compose_override | to_nice_yaml(indent=2, width=1000) }}"
    mode: '0644'
  when: posthog_compose_override | length > 0

- name: Remove docker-compose.override.yml
  ansible.builtin.file:
    path: "{{ posthog_install_dir }}/docker-compose.override.yml"
    state: absent
  when: posthog_compose_override | length == 0

- name: Start PostHog stack
  community.docker.docker_compose_v2:
    project_src: "{{ posthog_install_dir }}"
    state: present
    pull: always
    build: never
    wait: "{{ not posthog_skip_health_check }}"
    wait_timeout: "{{ posthog_health_check_timeout }}"
